<!doctype html>
<html><head><meta charset="utf-8"><title>Dungeon Creatures Preview</title>
<style>
  html,body{margin:0;background:#07060a;overflow:hidden;font-family:"Arial Black",Arial,sans-serif}
  canvas{display:block}
  .tag{position:absolute;transform:translate(-50%,-100%);text-align:center;color:#fff;text-shadow:0 3px 8px #000,0 0 2px #000;white-space:nowrap}
  .tag b{display:block;font-size:20px;letter-spacing:2px;opacity:.85}
  .tag span{display:block;font-size:34px}
  .tag i{display:block;font-style:normal;font-family:Arial,sans-serif;font-weight:bold;font-size:18px;opacity:.8}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

// ?only=2 renders just one creature close up
const only = Number(new URLSearchParams(location.search).get('only')) || 0;
const creatures = (await (await fetch('creatures.json')).json()).filter(c => !only || c.stage === only);
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0810);
scene.fog = new THREE.Fog(0x0a0810, 45, 110);

// Roblox-style dungeon: stone floor tiles + brick back wall
const tile = new THREE.BoxGeometry(3.9, 1, 3.9);
for (let x = -40; x <= 40; x += 4) for (let z = -30; z <= 20; z += 4) {
  const g = 0.16 + Math.random() * 0.06;
  const m = new THREE.Mesh(tile, new THREE.MeshStandardMaterial({color: new THREE.Color(g, g * 0.95, g * 1.05), roughness: 0.95}));
  m.position.set(x, -0.5, z); m.receiveShadow = true; scene.add(m);
}
const brick = new THREE.BoxGeometry(3.8, 1.8, 2);
for (let y = 0; y < 30; y += 2) for (let x = -44; x <= 44; x += 4) {
  const g = 0.11 + Math.random() * 0.05;
  const m = new THREE.Mesh(brick, new THREE.MeshStandardMaterial({color: new THREE.Color(g * 1.05, g, g), roughness: 1}));
  m.position.set(x + (y % 4 ? 2 : 0), y + 1, 14); m.receiveShadow = true; scene.add(m);
}
// torches on the wall
for (const x of [-26, -2, 26]) {
  const stick = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2, 0.5), new THREE.MeshStandardMaterial({color: 0x3a2a1a}));
  stick.position.set(x, 9, 12.8); scene.add(stick);
  const fire = new THREE.Mesh(new THREE.SphereGeometry(0.6), new THREE.MeshBasicMaterial({color: new THREE.Color(2.2, 0.9, 0.2)}));
  fire.position.set(x, 10.3, 12.8); scene.add(fire);
  const l = new THREE.PointLight(0xff8a30, 120, 30, 1.6); l.position.set(x, 10.5, 11.5); scene.add(l);
}

scene.add(new THREE.HemisphereLight(0x8a90b0, 0x201818, 0.9));
const key = new THREE.DirectionalLight(0xfff0e0, 2.2);
key.position.set(-20, 40, -30); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
Object.assign(key.shadow.camera, {left: -40, right: 40, top: 40, bottom: -10, far: 120});
scene.add(key);
const rim = new THREE.DirectionalLight(0x9060ff, 1.4); rim.position.set(20, 20, 30); scene.add(rim);

// Build parts exactly like Roblox: Block / Ball / Cylinder (cylinder axis = X), orientation order YXZ
const MAT = {
  SmoothPlastic: {roughness: 0.55, metalness: 0},
  Fabric: {roughness: 1, metalness: 0},
  Wood: {roughness: 0.9, metalness: 0},
  Metal: {roughness: 0.35, metalness: 0.75},
};
for (const c of creatures) {
  const off = only ? [0, 0, 0] : c.offset;
  for (const p of c.parts) {
    let geo;
    if (p.shape === 'Ball') geo = new THREE.SphereGeometry(p.size[0] / 2, 32, 20);
    else if (p.shape === 'Ellipsoid') { geo = new THREE.SphereGeometry(0.5, 40, 24); geo.scale(...p.size); }
    else if (p.shape === 'Cylinder') { geo = new THREE.CylinderGeometry(p.size[1] / 2, p.size[1] / 2, p.size[0], 32); geo.rotateZ(Math.PI / 2); }
    else geo = new THREE.BoxGeometry(...p.size);
    const col = new THREE.Color().setRGB(...p.color.map(v => v / 255), THREE.SRGBColorSpace);
    const mat = p.mat === 'Neon'
      ? new THREE.MeshBasicMaterial({color: col.clone().multiplyScalar(2)})
      : new THREE.MeshStandardMaterial({color: col, ...MAT[p.mat]});
    const m = new THREE.Mesh(geo, mat);
    m.position.set(p.pos[0] + off[0], p.pos[1] + off[1], p.pos[2] + off[2]);
    m.rotation.set(...p.rot.map(THREE.MathUtils.degToRad), 'YXZ');
    m.castShadow = p.mat !== 'Neon'; m.receiveShadow = true;
    scene.add(m);
    if (p.light) { const l = new THREE.PointLight(col, 12, p.light * 2, 1.5); l.position.copy(m.position); l.position.z -= 1; scene.add(l); }
  }
}

// Front of every creature is -Z, so the camera sits at -Z looking back at them
const camera = new THREE.PerspectiveCamera(only ? 32 : 38, W / H, 0.1, 300);
if (only) {
  const h = creatures[0].height;
  camera.position.set(h * 0.6, h * 0.6, -h * 2.4);
  camera.lookAt(0, h * 0.5, 0);
} else {
  camera.position.set(5, 14, -56);
  camera.lookAt(2, 11.5, 0);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.45, 0.35, 0.9));
composer.addPass(new OutputPass());
composer.render();

const labels = {1: ['STAGE 1', '#8dff5a', 'weak'], 2: ['STAGE 2', '#ff9a2e', 'normal enemy'], 3: ['STAGE 3', '#ff3030', 'BOSS']};
for (const c of creatures) {
  const off = only ? [0, 0, 0] : c.offset;
  const v = new THREE.Vector3(off[0], c.height + 1.2, 0).project(camera);
  const d = document.createElement('div'); d.className = 'tag';
  const [stage, colour, kind] = labels[c.stage];
  d.innerHTML = `<b style="color:${colour}">${stage} · ${kind}</b><span>${c.name}</span><i>${c.health} HP · ${c.height} studs · ${c.parts.length} parts</i>`;
  d.style.left = ((v.x + 1) / 2 * W) + 'px'; d.style.top = ((1 - v.y) / 2 * H) + 'px';
  document.body.appendChild(d);
}
window.DONE = true;
</script>
</body></html>
