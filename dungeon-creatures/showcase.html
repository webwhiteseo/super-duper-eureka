<!doctype html>
<html><head><meta charset="utf-8"><title>Monster Showcase</title>
<style>
  html,body{margin:0;overflow:hidden;background:var(--bg);font-family:"DejaVu Sans",Verdana,sans-serif}
  canvas{display:block}
  h1{position:absolute;left:58px;top:34px;margin:0;color:var(--text);font-size:58px;letter-spacing:2px;font-weight:800}
  .sub{position:absolute;left:60px;top:108px;color:var(--sub);font-size:21px;letter-spacing:1px}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 60% 55%,transparent 45%,var(--shade) 100%)}
  .card{position:absolute;bottom:38px;width:400px;transform:translateX(-50%);padding:16px 18px 18px;border:2px solid var(--border);border-radius:12px;background:var(--card);color:var(--text)}
  .card b{color:var(--accent);font-size:28px;margin-right:12px}
  .card span{font-size:28px;font-weight:800;letter-spacing:1.5px}
  .card p{margin:18px 0 0;color:#9fb3c8;font-size:17px;line-height:1.5}
  .card i{font-style:normal;color:var(--accent)}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<div class="vignette"></div>
<h1></h1>
<div class="sub">ACTUAL PART GEOMETRY &nbsp;/&nbsp; ROBLOX STUDIO BUILDER</div>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

// ?set=golems|spiders picks the monster set, ?only=2 renders just one close up
const SETS = {
  golems: {
    title: 'CRYSTAL CAVE GOLEMS', json: 'golems.json',
    css: {bg: '#0b1422', text: '#e8f4ff', sub: '#7fb6e6', border: '#2f6fae', card: '#0a1626ee', accent: '#5cc4ff', shade: '#060b14cc'},
    bg: 0x0d1828, floor: 0x0f1c2f, line: 0x2a5d8f, sky: 0xa8d0ff, ground: 0x1a2638, rim: 0x4aa8ff, glow: 0x1d4f8a,
    camera: [[11, 13, -68], [6, 7, 0]],
    info: {1: ['WEAKLING', 'Small / basic stone form'], 2: ['DUNGEON ENEMY', 'Larger / heavier armour'], 3: ['CRYSTAL TITAN BOSS', 'Massive / crystal heart']},
  },
  wraiths: {
    title: 'PHANTOM WRAITHS', json: 'wraiths.json',
    css: {bg: '#0f0a1a', text: '#f1ecff', sub: '#a993e6', border: '#5b3fa8', card: '#120c20ee', accent: '#7dffd8', shade: '#07040ecc'},
    bg: 0x130d22, floor: 0x161028, line: 0x46307e, sky: 0xc8b8ff, ground: 0x1a1230, rim: 0x6af0d0, glow: 0x3a2370,
    camera: [[10, 12, -64], [9, 7, 0]], zoom: 0.75, bloom: 0.45, bloomThreshold: 0.75,
    info: {1: ['WEAKLING', 'Small / drifting wisp'], 2: ['DUNGEON ENEMY', 'Larger / bone claws'], 3: ['WRAITH KING BOSS', 'Massive / scythe and soul orbs']},
  },
  spiders: {
    title: 'MAGMA SPIDERS', json: 'spiders.json',
    css: {bg: '#160c0a', text: '#fff1e6', sub: '#e6a07a', border: '#a04a1f', card: '#1a0d09ee', accent: '#ff8a3c', shade: '#0a0504cc'},
    bg: 0x1c0f0c, floor: 0x211310, line: 0x7a3418, sky: 0xffc8a8, ground: 0x2a1610, rim: 0xff6a20, glow: 0x7a2a0c,
    camera: [[13, 14, -68], [8, 4.5, 0]],
    info: {1: ['WEAKLING', 'Small / ember spiderling'], 2: ['DUNGEON ENEMY', 'Larger / lava-cracked shell'], 3: ['BROOD QUEEN BOSS', 'Massive / molten egg core']},
  },
};
const params = new URLSearchParams(location.search);
const SET = SETS[params.get('set') || 'golems'];
const only = Number(params.get('only')) || 0;
for (const [k, v] of Object.entries(SET.css)) document.documentElement.style.setProperty('--' + k, v);
document.querySelector('h1').textContent = SET.title;
const creatures = (await (await fetch(SET.json)).json()).filter(c => !only || c.stage === only);
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(SET.bg);
scene.fog = new THREE.Fog(SET.bg, 50, 130);
// glowing grid floor like a showcase stage
const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshBasicMaterial({color: SET.floor, fog: true}));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({opacity: 0.5}));
shadowCatcher.rotation.x = -Math.PI / 2; shadowCatcher.position.y = 0.01; shadowCatcher.receiveShadow = true; scene.add(shadowCatcher);
const lineMat = new THREE.LineBasicMaterial({color: SET.line, transparent: true, opacity: 0.8});
for (let z = -60; z <= 20; z += 3) {
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-200, 0.02, z), new THREE.Vector3(200, 0.02, z)]);
  scene.add(new THREE.Line(g, lineMat));
}

scene.add(new THREE.HemisphereLight(SET.sky, SET.ground, 2.2));
const key = new THREE.DirectionalLight(0xeef5ff, 3.2);
key.position.set(-25, 45, -35); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
Object.assign(key.shadow.camera, {left: -40, right: 40, top: 40, bottom: -10, far: 140});
scene.add(key);
const rim = new THREE.DirectionalLight(SET.rim, 2.0); rim.position.set(25, 20, 35); scene.add(rim);

const MAT = {
  Slate: {roughness: 0.85, metalness: 0.05},
  Basalt: {roughness: 0.9, metalness: 0.05},
  Fabric: {roughness: 1, metalness: 0},
  Metal: {roughness: 0.3, metalness: 0.8},
  Wood: {roughness: 0.9, metalness: 0},
  SmoothPlastic: {roughness: 0.55, metalness: 0},
};
const edges = new THREE.LineBasicMaterial({color: 0x0c1118, transparent: true, opacity: 0.55});
for (const c of creatures) {
  const off = only ? [0, 0, 0] : c.offset;
  for (const p of c.parts) {
    let geo;
    if (p.shape === 'Ball') geo = new THREE.SphereGeometry(p.size[0] / 2, 32, 20);
    else if (p.shape === 'Ellipsoid') { geo = new THREE.SphereGeometry(0.5, 40, 24); geo.scale(...p.size); }
    else if (p.shape === 'Cylinder') { geo = new THREE.CylinderGeometry(p.size[1] / 2, p.size[1] / 2, p.size[0], 32); geo.rotateZ(Math.PI / 2); }
    else geo = new THREE.BoxGeometry(...p.size);
    const col = new THREE.Color().setRGB(...p.color.map(v => v / 255), THREE.SRGBColorSpace);
    const neon = p.mat === 'Neon';
    const mat = neon ? new THREE.MeshBasicMaterial({color: col.clone().multiplyScalar(1.25)})
                     : new THREE.MeshStandardMaterial({color: col, ...(MAT[p.mat] || MAT.SmoothPlastic)});
    const m = new THREE.Mesh(geo, mat);
    m.position.set(p.pos[0] + off[0], p.pos[1] + off[1], p.pos[2] + off[2]);
    m.rotation.set(...p.rot.map(THREE.MathUtils.degToRad), 'YXZ');
    m.castShadow = !neon; m.receiveShadow = true;
    if (!neon && p.shape === 'Block') m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edges));
    scene.add(m);
    if (p.light) { const l = new THREE.PointLight(col, 25, p.light * 2, 1.5); l.position.copy(m.position); l.position.z -= 1.5; scene.add(l); }
  }
  // soft blue glow on the floor under each golem
  const glow = new THREE.Mesh(new THREE.CircleGeometry(c.height * 0.45, 48), new THREE.MeshBasicMaterial({color: SET.glow, transparent: true, opacity: 0.35}));
  glow.rotation.x = -Math.PI / 2; glow.position.set(off[0], 0.03, off[2]); scene.add(glow);
}

const camera = new THREE.PerspectiveCamera(only ? 30 : 30, W / H, 0.1, 400);
if (only) {
  const h = creatures[0].height;
  const zoom = SET.zoom || 1;
  camera.position.set(h * 0.9 * zoom, h * 0.85 * zoom, -h * 3.9 * zoom);
  camera.lookAt(0, h * 0.36, 0);
  const dist = camera.position.length();
  scene.fog.near = dist * 0.9; scene.fog.far = dist * 2.5;
  document.querySelector('h1').style.fontSize = '40px';
} else {
  camera.position.set(...SET.camera[0]);
  camera.lookAt(...SET.camera[1]);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), SET.bloom || 0.9, 0.55, SET.bloomThreshold || 0.5));
composer.addPass(new OutputPass());
composer.render();

const info = SET.info;
for (const c of creatures) {
  const off = only ? [0, 0, 0] : c.offset;
  const v = new THREE.Vector3(off[0], 0, 0).project(camera);
  const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = `<b>0${c.stage}</b><span>${info[c.stage][0]}</span><p>${info[c.stage][1]}<br><i>${c.health} HP</i> · ${c.height} studs · ${c.parts.length} parts</p>`;
  d.style.left = only ? '50%' : ((v.x + 1) / 2 * W) + 'px';
  document.body.appendChild(d);
}
window.DONE = true;
</script>
</body></html>
